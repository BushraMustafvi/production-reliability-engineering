groups:
  - name: reliability-api
    rules:
      - alert: ReliabilityAPIHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: reliability-api
        annotations:
          summary: "Reliability API error rate is high"
          description: "More than 5% of API requests are returning 5xx responses."

      - alert: ReliabilityAPIHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: reliability-api
        annotations:
          summary: "Reliability API latency is high"
          description: "The API p95 request latency has exceeded 500ms."


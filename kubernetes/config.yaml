apiVersion: v1
kind: ConfigMap
metadata:
  name: reliability-config
  namespace: reliability
data:
  POSTGRES_DB: reliability
  POSTGRES_USER: reliability
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: reliability-secrets
  namespace: reliability
type: Opaque
stringData:
  POSTGRES_PASSWORD: reliability

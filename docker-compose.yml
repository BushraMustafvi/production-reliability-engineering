services:
  postgres:
    image: postgres:16
    container_name: reliability-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reliability
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: reliability
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability -d reliability"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: reliability-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
